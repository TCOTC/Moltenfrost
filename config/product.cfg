; 熔霜 · 产品级常量
;
; 放这里的理由：这些值会随部署变化（换机器、换域名），而它们同时被界面、启动参数
; 与文档引用。写死在代码里的话，改一次要动好几处，还得重新提交与重新打包。
;
; 这个文件由 scripts/product_config.gd 读取，**在启动时读一次**，
; 并把生效值打进日志（见启动时的 `[config]` 行）——与手感数值的 `[feel]` 行同理：
; "改了但没生效"是这类外部配置最容易出的问题，而一行日志就能把它变成一眼可见。
;
; 代码里另有一份兜底值（scripts/product_config.gd 顶部的 DEFAULT_* 常量）。
; 本文件缺失、或某个键写错格式时，那一项就回退到兜底值，因此配置文件不可能
; 把程序弄成跑不起来的状态。最坏情况只是回到编译时那个地址。
;
; 这个文件不会被引擎改写，所以这里的注释能留住。
; （project.godot / export_presets.cfg / *.tscn / *.tres 不满足这一点，见 AGENTS.md。）

[network]

; 初始界面里「官方服务器」那一栏指向的房间目录。
;
; **这里填域名**（换机器只改 DNS 的 A 记录）。
;
; 但客户端**不会直接拿域名去发 HTTP**，而是启动时把它解析成 IP、用 IP 去连。
; 这不是多余的：腾讯云会拦截**发往未备案域名的 HTTP 请求**，返回一个 302 指向
;   https://dnspod.qcloud.com/static/webblock.html?d=<域名>:<端口>
; 而 Godot 的 HTTPRequest 会跟着这个重定向，于是拿到一页 1.6 万字节的 HTML，
; 列表解析失败（日志里是「房间目录返回的内容看不懂（16780 字节：<!DOCTYPE html>…）」）。
; 同一个 URL 换成 IP 就 200。实测对比（2026-09-30）：
;
;   GET  http://<域名>:27017/rooms   → 302 到 DNSPod 封禁页（列表永远拉不到）
;   GET  http://<IP>:27017/rooms     → 200 JSON
;   POST http://<域名>:27017/rooms/claim → 200（这一次没被拦，但不能指望它）
;
; 拦截看的是 HTTP 的 Host 头，而换成 IP 之后 Host 也是 IP，于是绕开了它。
; 解析是**异步**做的（见 scripts/product_config.gd 的 Resolve），不阻塞启动；
; 解析失败或超时（5 秒）就退回用域名——那时若域名已经备案，照样能用。
;
; **域名对 UDP 完全正常**：房间地址（服务端 --advertise 给的那个）走 UDP，
; 不受这条拦截影响，实测连得上、RTT 20 ms。
; 因此两处刻意不同：目录（HTTP）→ 这里，用域名；房间（UDP）→ --advertise。
official_host="moltenfrost-server.mytemos.com"

; 房间目录的端口（HTTP，TCP）。改这里要同步改服务端启动参数与安全组规则。
; 它不是游戏端口：玩家看到的房间地址是目录里每一项自己的 host:port。
official_directory_port=27017
