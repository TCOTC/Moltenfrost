[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; tools/ 与 docs/ 不进产物：导出预设是 all_resources，项目目录下的图片等会
; 被 Godot 当资源导入并打进 pck。
exclude_filter="tools/*, docs/*"
export_path="build/windows/Moltenfrost.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/architecture="x86_64"
application/product_name="Moltenfrost"
application/file_description="熔霜 Moltenfrost"

[preset.1]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*, docs/*"
; 导出 zip 而不是 .app：从 Windows 导出的 .app 会因为文件系统拿不到可执行位
; 而在 macOS 上跑不起来，zip 不受影响（见设计文档 4.1）。
export_path="build/macos/Moltenfrost.zip"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/architecture="universal"
application/bundle_identifier="com.moltenfrost.game"
application/short_version="0.1.0"
application/version="0.1.0"
